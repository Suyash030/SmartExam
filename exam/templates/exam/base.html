<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Online Exam{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<!-- 🔝 Navbar -->
<nav class="navbar navbar-dark bg-gradient" style="background: linear-gradient(to right, #667eea, #764ba2);">  <div class="container">
    <a class="navbar-brand" href="#">Online Exam</a>

    <div>
      {% if user.is_authenticated %}
        <span class="text-white me-3">Hello, {{ user.username }}</span>
        <a href="/logout/" class="btn btn-danger btn-sm">Logout</a>
      {% endif %}
    </div>
  </div>
</nav>

<!-- 📦 Page Content -->
<div class="container mt-5">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
