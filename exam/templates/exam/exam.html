{% extends 'exam/base.html' %}

{% block title %}Exam{% endblock %}

{% block content %}
<div class="card p-4 shadow">
  <h3 class="text-center mb-4">Exam</h3>

  <form method="post">
    {% csrf_token %}

    {% for q in questions %}
      <div class="mb-4">
        <p><strong>{{ forloop.counter }}. {{ q.question_text }}</strong></p>

        <div class="form-check">
          <input class="form-check-input" type="radio" name="{{ q.id }}" value="{{ q.option1 }}">
          <label>{{ q.option1 }}</label>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="radio" name="{{ q.id }}" value="{{ q.option2 }}">
          <label>{{ q.option2 }}</label>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="radio" name="{{ q.id }}" value="{{ q.option3 }}">
          <label>{{ q.option3 }}</label>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="radio" name="{{ q.id }}" value="{{ q.option4 }}">
          <label>{{ q.option4 }}</label>
        </div>
      </div>
    {% endfor %}

    <button class="btn btn-success w-100">Submit Exam</button>
  </form>
</div>
{% endblock %}
